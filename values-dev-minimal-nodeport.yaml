# Gravitee APIM - minimal dev install for small Kubernetes nodes.
# For the official `apim` Helm chart in the gravitee-api-management repo (helm/, chart v4.13.0).
#
# What runs after install (all replica 1, ~1.5GiB of requests total):
#   graviteeio-apim-mongodb-replicaset-0   MongoDB (single-node replica set, local-path)
#   graviteeio-apim-elasticsearch-\*       Elasticsearch: 1 master + 1 data(+ingest) node (local-path)
#   graviteeio-apim-management-api-\*      Management API   <- Ingress /management (+ /portal)
#   graviteeio-apim-gateway-\*             API Gateway      -> NodePort 30082 (consumers)
#   graviteeio-apim-management-ui-\*       Console UI       <- Ingress /
#
# Everything browser-facing is served by the cluster ingress (Traefik on 80/443 in this
# cluster) under ONE host: http://192.168.1.252.apim.sslip.io - one origin keeps the
# browser's authentication cookies first-party (third-party cookies are blocked by
# Brave Shields, incognito and modern browsers). sslip.io wildcard DNS resolves the
# name to the node IP; the API requires name-shaped URLs (bare IPs are rejected).
# In a browser without public DNS, add: 192.168.1.252 apim.internal -> and switch the
# ingress hosts + the gateway NodePort accordingly.
#
# Excluded: developer portal UI, Alert Engine, Gamma, Cockpit, Kafka console,
#           autoscaling, all Ingress TLS (dev only).
#
# Default admin login is admin / admin and the default JWT secret ships with the
# chart -- acceptable for a dev cluster, change both for anything else.

management:
  type: mongodb
ratelimit:
  type: mongodb

# The APIM chart pins frozen Bitnami legacy images (bitnamilegacy/*) for its
# MongoDB and Elasticsearch subcharts; without this flag the Bitnami image
# verification in the subcharts' NOTES fails the whole install.
global:
  security:
    allowInsecureImages: true

# No SMTP in dev: notifications fail silently instead of trying to connect
smtp:
  enabled: false
notifiers:
  smtp:
    enabled: false

# Tech-preview / enterprise extras - none in a minimal install
cockpit:
  enabled: false
kafkaConsole:
  enabled: false
gamma:
  enabled: false

portal:
  enabled: true
  autoscaling:
    enabled: false
  image:
    # UI images publish without the -debian suffix (chart default 4.13.0 does not exist)
    tag: 4.12.23
  # The portal UI's REST base: SAME ORIGIN as the portal itself (below) so its
  # cookies stay first-party too
  baseURL: http://192.168.1.252.bntbs.openapi.sslip.io/portal
  ingress:
    enabled: true
    scheme: http
    pathType: Prefix
    path: /
    ingressClassName: traefik
    hosts:
      - 192.168.1.252.bntbs.openapi.sslip.io
    annotations:
      # null removes the chart-default annotations (helm deep-merge keeps {} maps)
      kubernetes.io/ingress.class: null
      nginx.ingress.kubernetes.io/rewrite-target: null

api:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    # 4.13.0 GA images are not published yet (only 4.13.0-alpha.*); pin the latest GA
    tag: 4.12.23-debian
  ingress:
    management:
      enabled: true
      scheme: http
      pathType: Prefix
      path: /management
      ingressClassName: traefik
      hosts:
        - 192.168.1.252.apim.sslip.io
      annotations:
        # null removes the chart-default annotations (helm deep-merge keeps {} maps)
        kubernetes.io/ingress.class: null
        nginx.ingress.kubernetes.io/rewrite-target: null
    portal:
      enabled: true
      scheme: http
      pathType: Prefix
      path: /portal
      ingressClassName: traefik
      # Served under BOTH hosts: the portal's own host (same-origin for the portal
      # UI) and the console's host (same-origin for console-origin calls)
      hosts:
        - 192.168.1.252.bntbs.openapi.sslip.io
        - 192.168.1.252.apim.sslip.io
      annotations:
        # null removes the chart-default annotations (helm deep-merge keeps {} maps)
        kubernetes.io/ingress.class: null
        nginx.ingress.kubernetes.io/rewrite-target: null
  service:
    type: ClusterIP
    externalPort: 83
    internalPort: 8083

gateway:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    tag: 4.12.23-debian
  ingress:
    # Consumers can use the ingress host below OR the NodePort 30082 (kept for
    # curl/IP access). The console suggests this host as the default entrypoint
    # for published APIs.
    enabled: true
    scheme: http
    pathType: Prefix
    path: /
    ingressClassName: traefik
    hosts:
      - 192.168.1.252.bntbs.gateway.sslip.io
    annotations:
      # null removes the chart-default annotations (helm deep-merge keeps {} maps)
      kubernetes.io/ingress.class: null
      nginx.ingress.kubernetes.io/rewrite-target: null
  ingressController:
    enabled: false
  service:
    type: NodePort
    externalPort: 82
    nodePort: 30082
    internalPort: 8082

ui:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    # UI images publish without the -debian suffix
    tag: 4.12.23
  ingress:
    enabled: true
    scheme: http
    pathType: Prefix
    path: /
    ingressClassName: traefik
    hosts:
      - 192.168.1.252.apim.sslip.io
    annotations:
      # null removes the chart-default annotations (helm deep-merge keeps {} maps)
      kubernetes.io/ingress.class: null
      nginx.ingress.kubernetes.io/rewrite-target: null
  service:
    type: ClusterIP
    externalPort: 8002
    internalPort: 8080

# --- MongoDB subchart (bitnami/mongodb 16.5.45) -----------------------------
mongodb:
  enabled: true
  # Chart default is architecture: replicaset (matches mongo.dbhost default: ...-headless)
  replicaCount: 1
  image:
    # bitnamilegacy publishes only -r build-suffixed tags for 6.0.13 (plain 6.0.13 does not exist)
    repository: bitnamilegacy/mongodb
    tag: 6.0.13-debian-11-r21
  # Bitnami legacy images ship internal default configs as 0640 root:root and the image
  # entrypoint copies them at boot under `set -o errexit`, killing the container when it
  # runs as plain uid 1001 (verified locally). Run as uid 1001 but gid 0: the files are
  # group-readable, while the pod's fsGroup: 1001 keeps the data dir writable.
  containerSecurityContext:
    runAsGroup: 0
  # local-path (hostPath-backed) PVCs do not get the pod fsGroup applied; chown the
  # volume at pod start instead
  volumePermissions:
    enabled: true
    image:
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r48
    securityContext:
      runAsUser: 0
  # A single-node replica set needs no arbiter for quorum
  arbiter:
    enabled: false
  pdb:
    create: false
  networkPolicy:
    enabled: false
  extraFlags:
    # Keep mongod's cache inside the 512Mi limit
    - "--wiredTigerCacheSizeGB=0.25"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi

# --- Elasticsearch subchart (bitnami/elasticsearch 22.0.13) ------------------
# Keep 1 master + 1 data node; the data node also takes the ingest role because
# APIM's analytics pipeline (geoip/user_agent) needs an ingest-capable node.
es:
  enabled: true
  settings:
    # Single data node: no replica shards
    number_of_replicas: 0
  endpoints:
    - http://graviteeio-apim-elasticsearch-data-hl:9200

elasticsearch:
  enabled: true
  # bitnami/os-shell tags left the main Bitnami catalog; legacy still publishes them
  sysctlImage:
    repository: bitnamilegacy/os-shell
  # Same legacy-image group-permission issue as MongoDB: run containers as uid 1001
  # but gid 0 so the 0640 root-group-owned default configs are readable at boot.
  master:
    replicaCount: 1
    heapSize: 128m
    containerSecurityContext:
      runAsGroup: 0
    pdb:
      create: false
    networkPolicy:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 768Mi
      requests:
        cpu: 25m
        memory: 256Mi
    persistence:
      enabled: true
      storageClass: local-path
      size: 2Gi
  data:
    replicaCount: 1
    extraRoles:
      - ingest
    heapSize: 512m
    containerSecurityContext:
      runAsGroup: 0
    pdb:
      create: false
    networkPolicy:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 1024Mi
      requests:
        cpu: 50m
        memory: 256Mi
    persistence:
      enabled: true
      storageClass: local-path
      size: 3Gi
  coordinating:
    replicaCount: 0
  ingest:
    enabled: false
    replicaCount: 0
  # local-path (hostPath-backed) PVCs do not get the pod fsGroup applied; chown the
  # data dir at pod start (both master and data sts mount their PVC at
  # /bitnami/elasticsearch/data, so one top-level init container covers both)
  initContainers:
    - name: volume-permissions
      image: docker.io/bitnamilegacy/os-shell:12-debian-12-r48
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        capabilities:
          add: ["CHOWN"]
      command: ["/bin/sh", "-ec", "chown 1001:1001 /bitnami/elasticsearch/data"]
      volumeMounts:
        - name: data
          mountPath: /bitnami/elasticsearch/data