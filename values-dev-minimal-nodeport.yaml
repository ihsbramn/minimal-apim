# Gravitee APIM - minimal dev install for small Kubernetes nodes.
# For the official `apim` Helm chart in the gravitee-api-management repo (helm/, chart v4.13.0).
#
# What runs after install (all replica 1, ~1.5GiB of requests total):
#   graviteeio-apim-mongodb-replicaset-0   MongoDB (single-node replica set, local-path)
#   graviteeio-apim-elasticsearch-\*       Elasticsearch: 1 master + 1 data(+ingest) node (local-path)
#   graviteeio-apim-management-api-\*      Management API   -> NodePort 30083 (http)
#   graviteeio-apim-gateway-\*             API Gateway      -> NodePort 30082 (http)
#   graviteeio-apim-management-ui-\*       Console UI       -> NodePort 30081 (http)
#
# Excluded: developer portal UI, Alert Engine, Gamma, Cockpit, Kafka console,
#           autoscaling, all Ingress objects (NodePort only).
#
# Default admin login is admin / admin and the default JWT secret ships with the
# chart -- acceptable for a dev cluster, change both for anything else.

# The console nginx in the UI pod proxies the Management API on the SAME origin
# (:30081), so browser authentication cookies stay first-party. Cross-origin calls
# from :30081 to a :30083 API would be blocked as third-party cookies by Brave
# Shields, incognito and modern browsers, leaving /user at 401 after every login.
# NOTE: the proxy target is the in-namespace service name of the Management API -
# it must match the helm release name (`apim` here). Change it if you re-install
# under a different release name.
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: apim-dev-ui-nginx-conf
    data:
      default.conf: |
        server {
            listen [::]:$HTTP_PORT ipv6only=off;
            listen [::]:$HTTPS_PORT ipv6only=off;
            server_name $SERVER_NAME;
            large_client_header_buffers 4 64k;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; object-src 'none'; frame-ancestors 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src http: https:; base-uri 'self'; form-action 'self'; font-src 'self';" always;
            add_header X-XSS-Protection "1; mode=block";
            add_header X-Content-Type-Options nosniff;
            add_header X-Permitted-Cross-Domain-Policies none;

            index index.html index.htm;
            charset utf-8;
            client_max_body_size 64m;

            gzip on;
            gzip_disable "msie6";

            gzip_vary on;
            gzip_proxied any;
            gzip_comp_level 6;
            gzip_buffers 16 8k;
            gzip_http_version 1.1;
            gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;

            location /management/ {
                proxy_pass http://apim-api:8083/management/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 600s;
            }

            location /portal/ {
                proxy_pass http://apim-api:8083/portal/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 600s;
            }

            location / {
                try_files $uri $uri/ =404;
                error_page 404 /;
                root /rw.mount/www;
                sub_filter '<base href="/"' '<base href="$CONSOLE_BASE_HREF"';
                sub_filter_once on;
            }

            error_page   500 502 503 504  /50x.html;
            location = /50x.html {
                root   /rw.mount/www;
            }
        }
#
# ============================================================================
# EDIT the `ui` section below: the console's Management API URL (192.168.1.252).
# ============================================================================
management:
  type: mongodb
ratelimit:
  type: mongodb

# The Management API hands its own public URLs to the console on /v2/ui/bootstrap.
# These URLs are validated by the Management API with Guava InternetDomainName, which
# rejects bare IPs (last all-numeric label) and crashes the API otherwise. The console
# uses wildcards DNS (nip.io) as the hostname resolves to the node IP from any LAN
# machine with public DNS. Replace with your own DNS name for the node if preferred.
installation:
  type: standalone
  api:
    # Same origin as the console (:30081) - the console's nginx proxies it to the API
    url: http://192.168.1.252.nip.io:30081
  standalone:
    console:
      urls:
        - orgId: DEFAULT
          url: http://192.168.1.252.nip.io:30081/

# The APIM chart pins frozen Bitnami legacy images (bitnamilegacy/*) for its
# MongoDB and Elasticsearch subcharts; without this flag the Bitnami image
# verification in the subcharts' NOTES fails the whole install.
global:
  security:
    allowInsecureImages: true

# No SMTP in dev: notifications fail silently instead of trying to connect
smtp:
  enabled: false
notifiers:
  smtp:
    enabled: false

# Tech-preview / enterprise extras - none in a minimal install
portal:
  enabled: false
cockpit:
  enabled: false
kafkaConsole:
  enabled: false
gamma:
  enabled: false

api:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    # 4.13.0 GA images are not published yet (only 4.13.0-alpha.*); pin the latest GA
    tag: 4.12.23-debian
  ingress:
    management:
      enabled: false
    portal:
      enabled: false
  service:
    type: NodePort
    externalPort: 83
    nodePort: 30083

gateway:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    tag: 4.12.23-debian
  ingress:
    enabled: false
  service:
    type: NodePort
    externalPort: 82
    nodePort: 30082

ui:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    # UI images publish without the -debian suffix
    tag: 4.12.23
  ingress:
    enabled: false
  service:
    type: NodePort
    externalPort: 8002
    nodePort: 30081

  # ==========================================================================
  # The Management API URL is served on THIS ORIGIN by the console's nginx
  # (proxied to the apim-api service, see extraObjects), so the browser's
  # authentication cookies are first-party. Cross-origin 30081 -> 30083 was
  # blocked as third-party cookies (Brave Shields, incognito).
  # Do NOT override MGMT_API_URL via ui.env as well: the chart renders the same
  # env var itself and Kubernetes server-side apply (Fleet) rejects duplicates.
  # ==========================================================================
  # Written into the console's constants.json (the /v2/ui/bootstrap response
  # overrides it, so it stays consistent with installation.api.url below)
  baseURL: http://192.168.1.252.nip.io:30081/management
  env: []
  # Custom nginx conf for the console (proxies the Management API on the same origin)
  extraVolumes: |
    - name: ui-nginx-conf
      configMap:
        name: apim-dev-ui-nginx-conf
  extraVolumeMounts: |
    - name: ui-nginx-conf
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: default.conf

# --- MongoDB subchart (bitnami/mongodb 16.5.45) -----------------------------
mongodb:
  enabled: true
  # Chart default is architecture: replicaset (matches mongo.dbhost default: ...-headless)
  replicaCount: 1
  image:
    # bitnamilegacy publishes only -r build-suffixed tags for 6.0.13 (plain 6.0.13 does not exist)
    repository: bitnamilegacy/mongodb
    tag: 6.0.13-debian-11-r21
  # Bitnami legacy images ship internal default configs as 0640 root:root and the image
  # entrypoint copies them at boot under `set -o errexit`, killing the container when it
  # runs as plain uid 1001 (verified locally). Run as uid 1001 but gid 0: the files are
  # group-readable, while the pod's fsGroup: 1001 keeps the data dir writable.
  containerSecurityContext:
    runAsGroup: 0
  # local-path (hostPath-backed) PVCs do not get the pod fsGroup applied; chown the
  # volume at pod start instead
  volumePermissions:
    enabled: true
    image:
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r48
    securityContext:
      runAsUser: 0
  # A single-node replica set needs no arbiter for quorum
  arbiter:
    enabled: false
  pdb:
    create: false
  networkPolicy:
    enabled: false
  extraFlags:
    # Keep mongod's cache inside the 512Mi limit
    - "--wiredTigerCacheSizeGB=0.25"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi

# --- Elasticsearch subchart (bitnami/elasticsearch 22.0.13) ------------------
# Keep 1 master + 1 data node; the data node also takes the ingest role because
# APIM's analytics pipeline (geoip/user_agent) needs an ingest-capable node.
es:
  enabled: true
  settings:
    # Single data node: no replica shards
    number_of_replicas: 0
  endpoints:
    - http://graviteeio-apim-elasticsearch-data-hl:9200

elasticsearch:
  enabled: true
  # bitnami/os-shell tags left the main Bitnami catalog; legacy still publishes them
  sysctlImage:
    repository: bitnamilegacy/os-shell
  # Same legacy-image group-permission issue as MongoDB: run containers as uid 1001
  # but gid 0 so the 0640 root-group-owned default configs are readable at boot.
  master:
    replicaCount: 1
    heapSize: 128m
    containerSecurityContext:
      runAsGroup: 0
    pdb:
      create: false
    networkPolicy:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 768Mi
      requests:
        cpu: 25m
        memory: 256Mi
    persistence:
      enabled: true
      storageClass: local-path
      size: 2Gi
  data:
    replicaCount: 1
    extraRoles:
      - ingest
    heapSize: 512m
    containerSecurityContext:
      runAsGroup: 0
    pdb:
      create: false
    networkPolicy:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 1024Mi
      requests:
        cpu: 50m
        memory: 256Mi
    persistence:
      enabled: true
      storageClass: local-path
      size: 3Gi
  coordinating:
    replicaCount: 0
  ingest:
    enabled: false
    replicaCount: 0
  # local-path (hostPath-backed) PVCs do not get the pod fsGroup applied; chown the
  # data dir at pod start (both master and data sts mount their PVC at
  # /bitnami/elasticsearch/data, so one top-level init container covers both)
  initContainers:
    - name: volume-permissions
      image: docker.io/bitnamilegacy/os-shell:12-debian-12-r48
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        capabilities:
          add: ["CHOWN"]
      command: ["/bin/sh", "-ec", "chown 1001:1001 /bitnami/elasticsearch/data"]
      volumeMounts:
        - name: data
          mountPath: /bitnami/elasticsearch/data
